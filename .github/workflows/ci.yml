name: Code Library CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Verify Compiler Version
        run: g++ --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Compilation (GNU C++17)
        run: python scripts/build_all.py 4

      - name: Run Automated Test Suites
        run: python scripts/run_tests.py

      - name: Audit Repository & Check Metadata Consistency
        run: python scripts/audit_repo.py --compile
